[project]
name = "javapack-bridge"
version = "0.1.0"
description = "Convert Minecraft Java Edition resource packs to Bedrock .mcpack"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
javapack-bridge = "javapack_bridge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["javapack_bridge"]
