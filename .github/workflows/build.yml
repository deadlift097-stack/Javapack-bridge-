name: Build JavaPack Bridge (.levipack)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pytest .
          pytest -q
          python scripts/generate_mappings.py
          git diff --exit-code src/mod/Mappings.h

  build-levipack:
    needs: test-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Ninja
        run: |
          sdkmanager "platforms;android-28" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build .levipack packages
        shell: pwsh
        run: ./scripts/package.ps1 -Abi all

      - name: Upload .levipack artifacts
        uses: actions/upload-artifact@v4
        with:
          name: javapack-bridge-levipack
          path: build-*/*.levipack

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-*/*.levipack
